      <label>조회 비밀번호 <span class="req">*</span> <span class="hint">숫자 4자리</span></label>
      <input type="password" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required placeholder="접수 시 정한 4자리">

</div></section>

<script src="config.js"></script>
<script>
const STEPS = ['접수','등록','진행중','보완요청','완료'];
const form = document.getElementById('statusForm');
const result = document.getElementById('result');
const btn = document.getElementById('lookupBtn');

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  result.className = 'result';
  const data = Object.fromEntries(new FormData(form).entries());
  data.code = (data.code||'').trim().toUpperCase();

  if(!SITE_CONFIG.API_URL || SITE_CONFIG.API_URL.indexOf('http')!==0){
    return showErr('아직 서버(Apps Script) 주소가 설정되지 않았습니다. config.js의 API_URL을 먼저 입력하세요.');
  }

  btn.disabled = true; btn.textContent = '조회 중...';
  data.action = 'status';
  try{
    const res = await fetch(SITE_CONFIG.API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
      body:new URLSearchParams(data).toString()
    });
    const json = await res.json();
    if(json.ok){
      renderStatus(json);
    }else{
      showErr(json.error || '일치하는 민원을 찾을 수 없습니다. 접수번호와 비밀번호를 확인해주세요.');
    }
  }catch(err){
    showErr('네트워크 오류로 조회하지 못했습니다. 잠시 후 다시 시도해주세요.');
  }finally{
    btn.disabled = false; btn.textContent = '조회하기';
  }
});

function renderStatus(j){
  const cur = STEPS.indexOf(j.status);
  let stepsHtml = '<div class="steps">';
  STEPS.forEach((s,i)=>{
    const active = (s===j.status);
    const done = (cur>=0 && i<=cur);
    stepsHtml += '<div class="step" style="'+(active?'border-color:var(--blue);background:#e6f0ff':(done?'opacity:1':'opacity:.55'))+'"><b>'+(i+1)+'. '+s+'</b><small>'+(active?'현재 단계':(done?'완료':'대기'))+'</small></div>';
  });
  stepsHtml += '</div>';

  result.className = 'result ok show';
  result.innerHTML =
    '<div>접수번호 <b>'+escapeH(j.code)+'</b>'+(j.type?' · '+escapeH(j.type):'')+'</div>'+
    '<div style="margin:10px 0"><span class="badge-status s-'+escapeH(j.status)+'">'+escapeH(j.status)+'</span></div>'+
    stepsHtml+
    (j.memo?'<div style="margin-top:16px"><b>담당자 안내</b><br>'+escapeH(j.memo)+'</div>':'')+
    '<div style="margin-top:14px;color:var(--muted);font-size:.9rem">접수일 '+escapeH(j.created||'-')+' · 최근 업데이트 '+escapeH(j.updated||'-')+'</div>';
}

function showErr(msg){
  result.className='result err show';
  result.textContent=msg;
}
function escapeH(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
